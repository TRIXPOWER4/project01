<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms & Inputs</title>
</head>
<body>

    <h1>User Registration Form</h1>

    <form action="#" method="post">
        
        <p>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </p>

        <p>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8">
        </p>

        <p>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </p>

        <p>
            <label for="role">Preferred Role:</label><br>
            <select id="role" name="role" required>
                <option value="">-- Select a Role --</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="student">Student</option>
            </select>
        </p>

        <p>
            <label for="bio">Short Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" cols="30" placeholder="Tell us about yourself..."></textarea>
        </p>

        <p>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </p>

        <p>
            <button type="submit">Register</button>
        </p>

    </form>

</body>
</html>
